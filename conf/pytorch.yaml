defaults:
  - _base@_global_

model:
  _target_: models.simple_net.SimpleNet
  input_size: 784
  hidden_size: 256
  output_size: 10
  dropout: 0.3 

optimizer:
  _target_: torch.optim.Adam
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

loss_fn:
  _target_: torch.nn.CrossEntropyLoss

train_dataloader:
  _target_: utils.dataloaders.ExampleDataLoader
  dataset:
    _target_: utils.dataloaders.ExampleDataset
    train: true
  batch_size: 32
  shuffle: true
  num_workers: 0

test_dataloader:
  _target_: utils.dataloaders.ExampleDataLoader
  dataset:
    _target_: utils.dataloaders.ExampleDataset
    train: false
  batch_size: 32
  shuffle: false
  num_workers: 0

training:
  epochs: 20
  self_supervised: false
  checkpoint_freq: 50

device: cpu