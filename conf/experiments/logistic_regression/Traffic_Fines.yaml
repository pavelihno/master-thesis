experiment_name: lr_traffic_fines

dataset:
  type: outcome
  dataset_name: Traffic_Fines
  dataset_folder: datasets/raw
  labels_folder: datasets/labels/binary
  train_ratio: 0.8
  min_prefix: 3
  max_prefix: 10

bucketer:
  type: prefix_length
  case_id_col: prefix_id

transformer:
  type: aggregate
  case_id_col: prefix_id
  cat_cols:
    - concept:name
  num_cols:
    - time_since_last_event
    - time_since_start

model:
  type: logistic_regression
  params:
    C: 1.0
    max_iter: 1000
    random_state: 42

output:
  folder: experiments/outputs
  save_model: true
  model_folder: experiments/models