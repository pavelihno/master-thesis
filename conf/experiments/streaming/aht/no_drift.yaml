task:
  type: next_activity

dataset:
  dataset_name: NO_DRIFT
  dataset_path: datasets/stream/synthetic/no_drift.xes
  end_events:
    - 'H'
    - 'N'
    - 'O'

transformer:
  type: index
  max_events: 10
  include_prefix_len: false

model:
  type: aht
  params:
    drift_detector:
      type: none

    grace_period: 100
    delta: 0.001
    tau: 0.05
    split_criterion: 'info_gain'

    leaf_prediction: 'nba'
    nb_threshold: 10

    switch_significance: 0.05
    max_depth: 20
    seed: 42

output:
  folder: experiments/outputs/streaming/no_drift
