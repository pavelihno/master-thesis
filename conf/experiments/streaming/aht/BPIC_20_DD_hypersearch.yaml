hyperparam_search: true

task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events: ["Payment Handled"]

transformer:
  type: [index, dim]
  max_events: [4, 6, 8]
  include_prefix_len: false

model:
  type: aht
  params:
    drift_detector:
      type: adwin
      delta: [0.0001, 0.001, 0.01]

    grace_period: [50, 100, 200]
    delta: [0.0001, 0.001, 0.01]
    tau: [0.01, 0.05]
    split_criterion: info_gain

    leaf_prediction: [mc, nba]
    nb_threshold: 10

    switch_significance: 0.05
    max_depth: [10, 20, 30]

    seed: 42

search:
  method: grid
  metric: f1_macro
  maximize: true

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
