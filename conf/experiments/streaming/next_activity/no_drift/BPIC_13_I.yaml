task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: none
    encoding: one_hot
    epochs: 30
    init_size: 6554
    loss_fn:
      type: cross_entropy
    n_classes: 4
    optimizer:
      lr: 0.03392839712760276
      type: nadam
    sequence_model:
      dropout: 0.20685914083071044
      hidden_dim: 59
      num_layers: 2
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/no_drift
