task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: none
    encoding: one_hot
    epochs: 30
    init_size: 5644
    loss_fn:
      type: cross_entropy
    n_classes: 17
    optimizer:
      lr: 0.007226272585742527
      type: nadam
    sequence_model:
      dropout: 0.5104207909750477
      hidden_dim: 27
      num_layers: 3
      type: lstm
    sequence_window: 6
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/no_drift
