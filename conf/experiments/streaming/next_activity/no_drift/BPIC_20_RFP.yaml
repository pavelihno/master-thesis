task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: none
    encoding: one_hot
    epochs: 30
    init_size: 3680
    loss_fn:
      type: cross_entropy
    n_classes: 19
    optimizer:
      lr: 0.006780755337010414
      type: nadam
    sequence_model:
      dropout: 0.5802031214794293
      hidden_dim: 111
      num_layers: 3
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/no_drift
