task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: none
    encoding: one_hot
    epochs: 30
    init_size: 1825
    loss_fn:
      type: cross_entropy
    n_classes: 29
    optimizer:
      lr: 0.0021103929400470294
      type: nadam
    sequence_model:
      dropout: 0.2673477455091161
      hidden_dim: 63
      num_layers: 1
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/no_drift
