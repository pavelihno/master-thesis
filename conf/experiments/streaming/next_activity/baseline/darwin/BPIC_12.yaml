task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 32
    encoding: word2vec
    epochs: 30
    init_size: 25040
    loss_fn:
      type: cross_entropy
    n_classes: 24
    optimizer:
      lr: 0.005701554417887797
      type: nadam
    sequence_model:
      dropout: 0.1623562201266593
      hidden_dim: 39
      num_layers: 2
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline