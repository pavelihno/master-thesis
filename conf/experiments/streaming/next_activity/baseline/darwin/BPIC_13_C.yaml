task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  end_events:
  - Completed

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 666
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.05896407567734838
      type: nadam
    sequence_model:
      type: lstm
      hidden_dim: 35
      num_layers: 2
      dropout: 0.4410301114290178
    sequence_window: 6
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/baseline
