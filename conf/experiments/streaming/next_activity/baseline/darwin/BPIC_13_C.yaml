task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 8
    encoding: word2vec
    epochs: 30
    init_size: 666
    loss_fn:
      type: cross_entropy
    n_classes: 4
    optimizer:
      lr: 0.0016602987540240658
      type: nadam
    sequence_model:
      dropout: 0.4608441950161374
      hidden_dim: 49
      num_layers: 2
      type: lstm
    sequence_window: 6
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
