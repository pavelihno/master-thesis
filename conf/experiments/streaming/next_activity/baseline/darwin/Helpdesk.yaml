task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  end_events:
  - Closed

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dropout: 0.18843092991715463
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    hidden_dim: 57
    init_size: 2135
    loss_fn:
      type: cross_entropy
    lstm_layers: 2
    max_n_classes: 30
    optimizer:
      lr: 0.0069095386203015885
      type: nadam
    sequence_window: 3
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/baseline
