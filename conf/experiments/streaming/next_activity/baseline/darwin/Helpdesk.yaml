task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 8
    encoding: word2vec
    epochs: 30
    init_size: 2135
    loss_fn:
      type: cross_entropy
    n_classes: 14
    optimizer:
      lr: 0.0054607989620772636
      type: nadam
    sequence_model:
      dropout: 0.4180494887179954
      hidden_dim: 36
      num_layers: 2
      type: lstm
    sequence_window: 5
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
