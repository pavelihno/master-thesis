task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  end_events:
  - Closed

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 2135
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.0229658615933049
      type: nadam
    sequence_model:
      type: lstm
      hidden_dim: 57
      num_layers: 2
      dropout: 0.31697640130531257
    sequence_window: 5
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/baseline
