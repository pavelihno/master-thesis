task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 3680
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.040093660211867846
      type: nadam
    sequence_model:
      dropout: 0.43920348961052785
      hidden_dim: 42
      num_layers: 1
      type: lstm
    sequence_window: 3
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/next_activity/baseline
