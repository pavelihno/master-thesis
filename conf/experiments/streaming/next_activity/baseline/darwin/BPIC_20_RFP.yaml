task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  end_events:
  - Payment Handled

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dropout: 0.5248049414576589
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    hidden_dim: 100
    init_size: 3680
    loss_fn:
      type: cross_entropy
    lstm_layers: 2
    max_n_classes: 30
    optimizer:
      lr: 0.013775752779945433
      type: nadam
    sequence_window: 3
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/baseline
