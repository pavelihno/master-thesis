task:
  type: next_activity
  mode: predict_and_learn 
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 8
    encoding: word2vec
    epochs: 30
    init_size: 1522
    loss_fn:
      type: cross_entropy
    n_classes: 16
    optimizer:
      lr: 0.031114123699752298
      type: nadam
    sequence_model:
      dropout: 0.2325391288327115
      hidden_dim: 43
      num_layers: 1
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
