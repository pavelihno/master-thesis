task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 32
    encoding: word2vec
    epochs: 30
    init_size: 5222
    loss_fn:
      type: cross_entropy
    n_classes: 289
    optimizer:
      lr: 0.006605600653623587
      type: nadam
    sequence_model:
      dropout: 0.05899325275083511
      hidden_dim: 26
      num_layers: 2
      type: lstm
    sequence_window: 75
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline