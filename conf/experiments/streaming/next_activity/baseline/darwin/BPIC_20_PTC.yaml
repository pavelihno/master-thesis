task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 1825
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.00925175485223048
      type: nadam
    sequence_model:
      type: lstm
      hidden_dim: 85
      num_layers: 2
      dropout: 0.34529472812810247
    sequence_window: 5
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/next_activity/baseline
