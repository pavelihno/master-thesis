task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 16
    encoding: word2vec
    epochs: 30
    init_size: 1825
    loss_fn:
      type: cross_entropy
    n_classes: 29
    optimizer:
      lr: 0.0026245921873039504
      type: nadam
    sequence_model:
      dropout: 0.4213960800946638
      hidden_dim: 102
      num_layers: 2
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
