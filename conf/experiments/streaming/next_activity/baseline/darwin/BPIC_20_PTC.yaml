task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 1825
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.023606915291176922
      type: nadam
    sequence_model:
      dropout: 0.22620485417992336
      hidden_dim: 108
      num_layers: 2
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
