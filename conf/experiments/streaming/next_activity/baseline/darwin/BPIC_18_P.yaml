task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_P
  source: log
  dataset_path: datasets/raw/BPIC_18_P.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 4
    encoding: word2vec
    epochs: 30
    init_size: 9304
    loss_fn:
      type: cross_entropy
    n_classes: 10
    optimizer:
      lr: 0.003051060956221081
      type: nadam
    sequence_model:
      dropout: 0.3937531412179469
      hidden_dim: 35
      num_layers: 1
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline