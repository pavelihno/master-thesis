task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 512
    epochs: 30
    init_size: 5644
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.005922939066430109
      type: nadam
    sequence_model:
      dropout: 0.10474339468430138
      hidden_dim: 44
      num_layers: 2
      type: lstm
    sequence_window: 6
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
