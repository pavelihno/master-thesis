task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events:
  - Payment Handled

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    init_size: 5644
    batch_size: 32
    drift_detector:
      type: none
    dropout: 0.010390562818078881
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 10
    hidden_dim: 78
    loss_fn:
      type: cross_entropy
    lstm_layers: 2
    max_n_classes: 30
    optimizer:
      lr: 0.00680963724358539
      type: nadam
    sequence_window: 3
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
