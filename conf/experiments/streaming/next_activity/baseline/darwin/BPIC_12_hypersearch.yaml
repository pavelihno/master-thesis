hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 13110
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    w2v_window: 5
    sequence_window:
      search: choice
      options:
      - 3
      - 4
      - 5
      - 6
      - 7
    embedding_dim:
      search: choice
      options:
      - 64
      - 128
      - 256
    sequence_model:
      type: process_transformer
      head_dim:
        search: choice
        options:
        - 16
        - 32
        - 64
      num_heads:
        search: choice
        options:
        - 4
        - 8
      num_layers:
        search: choice
        options:
        - 1
        - 2
      dropout:
        search: float
        low: 0.0
        high: 0.5
      pooling_type:
        search: choice
        options:
        - max
        - mean
      pooling_dropout: 0.1
    batch_size:
      search: choice
      options:
      - 32
      - 64
    epochs: 100
    dynamic_n_classes: true
    max_n_classes: 30
    init_size: 9667
    optimizer:
      type: nadam
      lr:
        search: float
        low: -4
        high: -2
        exp: true
        base: 10
    loss_fn:
      type: cross_entropy
    drift_detector:
      type: adwin
search:
  metric: macro_f1
  maximize: true
  max_trials: 50
  seed: 123
output:
  folder: experiments/outputs/streaming/BPIC_12