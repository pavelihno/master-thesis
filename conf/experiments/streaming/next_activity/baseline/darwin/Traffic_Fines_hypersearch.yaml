hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 56147
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    w2v_window: 5
    sequence_window:
      search: choice
      options:
      - 3
      - 4
      - 5
      - 6
      - 7
    embedding_dim:
      search: choice
      options:
      - 4
      - 8
      - 16
      - 32
    sequence_model:
      type: lstm
      hidden_dim:
        search: int
        low: 10
        high: 150
        log: true
      num_layers:
        search: choice
        options:
        - 2
        - 3
      dropout:
        search: float
        low: 0.0
        high: 1.0
    batch_size:
      search: choice
      options:
      - 32
      - 64
    epochs: 30
    init_size: 30367
    optimizer:
      type: nadam
      lr:
        search: float
        low: -3
        high: -1
        exp: true
        base: 10
    loss_fn:
      type: cross_entropy
    drift_detector:
      type: adwin
    n_classes: 11
    encoding: word2vec
search:
  metric: macro_f1
  maximize: true
  max_trials: 20
  seed: 4324235
output:
  folder: experiments/outputs/streaming/Traffic_Fines
