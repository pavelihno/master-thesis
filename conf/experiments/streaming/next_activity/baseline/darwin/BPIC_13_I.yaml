task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 4
    encoding: word2vec
    epochs: 30
    init_size: 6554
    loss_fn:
      type: cross_entropy
    n_classes: 4
    optimizer:
      lr: 0.0045745163749233994
      type: nadam
    sequence_model:
      dropout: 0.45035519225117115
      hidden_dim: 30
      num_layers: 2
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
