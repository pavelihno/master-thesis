task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 7216
    loss_fn:
      type: cross_entropy
    max_n_classes: 40
    optimizer:
      lr: 0.010260651575963136
      type: nadam
    sequence_model:
      type: lstm
      hidden_dim: 56
      num_layers: 2
      dropout: 0.17491008411944947
    sequence_window: 7
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/next_activity/baseline
