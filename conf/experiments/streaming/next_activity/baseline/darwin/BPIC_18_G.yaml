task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_G
  source: log
  dataset_path: datasets/raw/BPIC_18_G.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 16
    encoding: word2vec
    epochs: 30
    init_size: 43601
    loss_fn:
      type: cross_entropy
    n_classes: 16
    optimizer:
      lr: 0.013205995329667273
      type: nadam
    sequence_model:
      dropout: 0.4524547526159615
      hidden_dim: 25
      num_layers: 3
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
