hyperparam_search: true

task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events: ["Payment Handled"]

transformer:
  type: darwin

model:
  type: darwin
  params:
    w2v_window: 5

    sequence_window: # 3 - 7
      search: choice
      options: [3, 4, 5, 6, 7]

    embedding_dim: # 2^4 - 2^10
      search: choice
      options: [128, 256, 512]

    lstm_layers: # 1, 2, 3
      search: choice
      options: [2, 3]

    hidden_dim: # 10 - 150
      search: int
      low: 10
      high: 150
      log: true

    dropout: # 0.0 - 1.0
      search: float
      low: 0.0
      high: 1.0

    batch_size: # 2^5 - 2^10
      search: choice
      options: [32, 64]

    epochs: 10
    dynamic_n_classes: true
    max_n_classes: 30
    init_size: 1000

    optimizer:
      type: nadam
      lr: # 10^-5 - 10^-1
        search: float
        low: -3
        high: -1
        exp: true
        base: 10

    loss_fn:
      type: cross_entropy

    drift_detector:
      type: none

search:
  metric: loss
  maximize: false
  max_trials: 15
  seed: 123

output:
  folder: experiments/outputs/streaming/BPIC_20_DD