task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_G
  source: log
  dataset_path: datasets/raw/BPIC_18_G.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 8
    encoding: word2vec
    epochs: 100
    init_size: 43601
    loss_fn:
      type: cross_entropy
    n_classes: 16
    optimizer:
      lr: 0.0023573519705423884
      type: nadam
    sequence_model:
      dropout: 0.15833042707050204
      head_dim: 32
      num_heads: 8
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: last
      type: process_transformer
    sequence_window: 128
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
