task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  end_events:
  - Completed

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 100
    init_size: 666
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.001
      type: nadam
    sequence_model:
      dropout: 0.06639539790334475
      head_dim: 32
      num_heads: 4
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 5
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/BPIC_13_C
