hyperparam_search: true

task:
  type: next_activity
  mode: predict_and_learn
  max_events: 3680

dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  end_events: ["Payment Handled"]

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    w2v_window: 5

    sequence_window: # 3 - 7
      search: choice
      options: [3, 4, 5, 6, 7]

    embedding_dim: # 2^4 - 2^10
      search: choice
      options: [64, 128, 256]

    sequence_model:
      type: process_transformer

      head_dim: # 16 - 80
        search: int
        low: 10
        high: 80

      num_heads:
        search: choice
        options: [4, 8, 16]

      num_layers: # 1, 2, 3
        search: choice
        options: [1, 2, 3]

      dropout: # 0.0 - 1.0
        search: float
        low: 0.0
        high: 0.6

      pooling_type: 'max'

      pooling_dropout: 0.1

    batch_size: # 2^5 - 2^10
      search: choice
      options: [32, 64]

    epochs: 30
    dynamic_n_classes: true
    max_n_classes: 30
    init_size: 2291

    optimizer:
      type: nadam
      lr: # 10^-5 - 10^-1
        search: float
        low: -3
        high: -1
        exp: true
        base: 10

    loss_fn:
      type: cross_entropy

    drift_detector:
      type: adwin

search:
  metric: macro_f1
  maximize: true
  max_trials: 200
  seed: 123

output:
  folder: experiments/outputs/streaming/BPIC_20_RFP
