task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 30
    init_size: 1522
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.002080409394558654
      type: nadam
    sequence_model:
      dropout: 0.16737860545913713
      head_dim: 32
      num_heads: 4
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: mean
      type: process_transformer
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
