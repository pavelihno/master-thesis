task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 2135
    loss_fn:
      type: cross_entropy
    n_classes: 14
    optimizer:
      lr: 0.0015194750336395525
      type: nadam
    sequence_model:
      dropout: 0.4078880736692122
      head_dim: 16
      num_heads: 8
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: last
      type: process_transformer
    sequence_window: 128
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
