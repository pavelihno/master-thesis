task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 2135
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.001019385680860298
      type: nadam
    sequence_model:
      dropout: 0.3310889116760796
      head_dim: 64
      num_heads: 8
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 3
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/Helpdesk
