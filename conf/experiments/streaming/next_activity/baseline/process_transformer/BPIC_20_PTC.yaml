task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 30
    init_size: 1825
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.0016392126677998039
      type: nadam
    sequence_model:
      dropout: 0.2183946416478991
      head_dim: 16
      num_heads: 8
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 7
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/BPIC_20_PTC
