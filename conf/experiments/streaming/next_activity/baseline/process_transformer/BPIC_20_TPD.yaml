task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 16
    encoding: word2vec
    epochs: 30
    init_size: 8659
    loss_fn:
      type: cross_entropy
    n_classes: 51
    optimizer:
      lr: 0.0017765173764751935
      type: nadam
    sequence_model:
      dropout: 0.08757161244171663
      head_dim: 16
      num_heads: 8
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: last
      type: process_transformer
    sequence_window: 128
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
