task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 8
    encoding: word2vec
    epochs: 30
    init_size: 56147
    loss_fn:
      type: cross_entropy
    n_classes: 11
    optimizer:
      lr: 0.0031250688614111186
      type: nadam
    sequence_model:
      dropout: 0.03334761203475689
      head_dim: 16
      num_heads: 4
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 128
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
