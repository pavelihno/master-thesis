task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  end_events:
  - Completed

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 100
    init_size: 6554
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.00015873343497754393
      type: adam
    sequence_model:
      dropout: 0.32635301733702526
      head_dim: 64
      num_heads: 8
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 7
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/BPIC_13_I
