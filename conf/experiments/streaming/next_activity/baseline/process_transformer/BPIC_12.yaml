task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 100
    init_size: 25040
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.0014740167721009414
      type: nadam
    sequence_model:
      dropout: 0.04417594857715554
      head_dim: 16
      num_heads: 8
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: mean
      type: process_transformer
    sequence_window: 3
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
