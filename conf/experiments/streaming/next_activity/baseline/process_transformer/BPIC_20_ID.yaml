task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 7216
    loss_fn:
      type: cross_entropy
    n_classes: 34
    optimizer:
      lr: 0.0030628914962905333
      type: nadam
    sequence_model:
      dropout: 0.08414787107539465
      head_dim: 16
      num_heads: 4
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 128
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
