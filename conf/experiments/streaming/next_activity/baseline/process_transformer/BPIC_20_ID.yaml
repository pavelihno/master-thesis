task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 7216
    loss_fn:
      type: cross_entropy
    max_n_classes: 40
    optimizer:
      lr: 0.0015068979368865738
      type: nadam
    sequence_model:
      dropout: 0.1964036493087466
      head_dim: 16
      num_heads: 4
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: mean
      type: process_transformer
    sequence_window: 6
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/BPIC_20_ID
