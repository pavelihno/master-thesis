hyperparam_search: true

task:
  type: next_activity
  mode: predict_and_learn
  max_events: 6554

dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  end_events: ["Completed"]

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    w2v_window: 5

    sequence_window: # 3 - 7
      search: choice
      options: [3, 4, 5, 6, 7]

    embedding_dim: # 2^4 - 2^10
      search: choice
      options: [64, 128, 256]

    sequence_model:
      type: process_transformer

      head_dim: # 2^4 - 2^6
        search: choice
        options: [16, 32, 64]

      num_heads:
        search: choice
        options: [4, 8]

      num_layers: # 1, 2
        search: choice
        options: [1, 2]

      dropout: # 0.0 - 0.5
        search: float
        low: 0.0
        high: 0.5

      pooling_type:
        search: choice
        options: ['max', 'mean']

      pooling_dropout: 0.1

    batch_size: # 2^5 - 2^10
      search: choice
      options: [32, 64]

    epochs: 100
    dynamic_n_classes: true
    max_n_classes: 30
    init_size: 4962

    optimizer:
      type: adam
      lr: # 10^-4 - 10^-2
        search: float
        low: -4
        high: -2
        exp: true
        base: 10

    loss_fn:
      type: cross_entropy

    drift_detector:
      type: adwin

search:
  metric: macro_f1
  maximize: true
  max_trials: 200
  seed: 123

output:
  folder: experiments/outputs/streaming/BPIC_13_I
