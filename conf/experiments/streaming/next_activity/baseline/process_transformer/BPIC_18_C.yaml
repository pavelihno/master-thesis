task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 4
    encoding: word2vec
    epochs: 100
    init_size: 10764
    loss_fn:
      type: cross_entropy
    n_classes: 7
    optimizer:
      lr: 0.005380011438144698
      type: nadam
    sequence_model:
      dropout: 0.19614060157891455
      head_dim: 64
      num_heads: 4
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: last
      type: process_transformer
    sequence_window: 128
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
