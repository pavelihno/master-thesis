task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 100
    init_size: 10764
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.00010818896978381399
      type: nadam
    sequence_model:
      dropout: 0.3287991801895341
      head_dim: 32
      num_heads: 4
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 5
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline
