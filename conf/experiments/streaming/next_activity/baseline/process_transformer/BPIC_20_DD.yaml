task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events:
  - Payment Handled

transformer:
  type: darwin

model:
  type: darwin_classifier
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 30
    init_size: 5644
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.001164629726945112
      type: nadam
    sequence_model:
      type: process_transformer
      dropout: 0.0796744774840137
      head_dim: 47
      num_heads: 4
      num_layers: 1
      pooling_type: mean
    sequence_window: 3
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/baseline
