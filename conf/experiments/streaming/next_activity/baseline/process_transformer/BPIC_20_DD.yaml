task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 4
    encoding: word2vec
    epochs: 30
    init_size: 5644
    loss_fn:
      type: cross_entropy
    n_classes: 17
    optimizer:
      lr: 0.001630516934709854
      type: nadam
    sequence_model:
      dropout: 0.12620559977231718
      head_dim: 32
      num_heads: 4
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: last
      type: process_transformer
    sequence_window: 128
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
