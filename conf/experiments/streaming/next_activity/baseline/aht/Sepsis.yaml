task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  include_prefix_len: false
  max_events: 4
  type: index
model:
  params:
    delta: 0.000257218100587125
    drift_detector:
      type: none
    grace_period: 77
    leaf_prediction: mc
    max_depth: 40
    nb_threshold: 30
    seed: 42
    split_criterion: gini
    switch_significance: 0.047200941008389286
    tau: 0.15316158800154267
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/baseline
