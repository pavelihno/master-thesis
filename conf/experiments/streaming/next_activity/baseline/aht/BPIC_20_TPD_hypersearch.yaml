hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  type: index
  max_events:
    search: choice
    options:
    - 4
    - 6
  include_prefix_len: false
model:
  type: aht
  params:
    drift_detector:
      type: none
    grace_period:
      search: int
      low: 75
      high: 200
    delta:
      search: float
      low: -4
      high: -2
      exp: true
      base: 10
    tau:
      search: float
      low: 0.01
      high: 0.2
    split_criterion: info_gain
    leaf_prediction:
      search: choice
      options:
      - mc
      - nba
    nb_threshold:
      search: int
      low: 0
      high: 30
    switch_significance:
      search: float
      low: 0.01
      high: 0.15
    max_depth:
      search: choice
      options:
      - 10
      - 20
    seed: 42
search:
  metric: macro_f1
  max_trials: 15
  maximize: true
  seed: 123
output:
  folder: experiments/outputs/streaming/BPIC_20_TPD
