task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  end_events:
  - Payment Handled

transformer:
  type: dim
  include_prefix_len: false
  max_events: 6

model:
  type: aht
  params:
    drift_detector:
      type: none
    delta: 7.854372670351977e-06
    grace_period: 158
    leaf_prediction: mc
    max_depth: 20
    nb_threshold: 8
    seed: 42
    split_criterion: gini
    switch_significance: 0.13048998141287263
    tau: 0.07044285674384111

output:
  folder: experiments/outputs/streaming/BPIC_20_ID
