task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 0.00012758465387532336
    drift_detector:
      type: adwin
    grace_period: 84
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 14
    seed: 42
    split_criterion: gini
    switch_significance: 0.013959835462388295
    tau: 0.1977661614779157
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/baseline
