task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  include_prefix_len: false
  max_events: 6
  type: index
model:
  params:
    delta: 5.602426232740544e-05
    drift_detector:
      type: none
    grace_period: 160
    leaf_prediction: mc
    max_depth: 30
    nb_threshold: 30
    seed: 42
    split_criterion: gini
    switch_significance: 0.09349938975517397
    tau: 0.13689047189735
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/baseline