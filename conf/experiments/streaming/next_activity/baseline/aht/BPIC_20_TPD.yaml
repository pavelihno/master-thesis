task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  end_events:
  - Payment Handled

transformer:
  include_prefix_len: false
  max_events: 6
  type: index

model:
  type: aht
  params:
    drift_detector:
      type: none
    delta: 0.008891731430763971
    grace_period: 134
    leaf_prediction: mc
    max_depth: 10
    nb_threshold: 19
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.07540986919851063
    tau: 0.17820581201697874

output:
  folder: experiments/outputs/streaming/next_activity/baseline
