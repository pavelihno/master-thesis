task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  end_events:
  - Completed

transformer:
  include_prefix_len: false
  max_events: 10
  type: index

model:
  type: aht
  params:
    drift_detector:
      type: none
    delta: 0.00001
    grace_period: 221
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 13
    seed: 42
    split_criterion: gini
    switch_significance: 0.08
    tau: 0.08

output:
  folder: experiments/outputs/streaming/next_activity/baseline
