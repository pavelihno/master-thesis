task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events:
  - Payment Handled

transformer:
  type: dim
  max_events: 4
  include_prefix_len: false

model:
  type: aht
  params:
    drift_detector:
      type: none
    delta: 0.01
    grace_period: 63
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 16
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.035
    tau: 0.13

output:
  folder: experiments/outputs/streaming/BPIC_20_DD