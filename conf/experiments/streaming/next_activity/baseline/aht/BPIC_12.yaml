task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  include_prefix_len: false
  max_events: 4
  type: dim
model:
  params:
    delta: 0.005822179820537379
    drift_detector:
      type: none
    grace_period: 90
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 0
    seed: 42
    split_criterion: gini
    switch_significance: 0.10556474472677597
    tau: 0.17369169910150897
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/baseline
