hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 8659
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 3
  type: freq
model:
  type: arf
  params:
    n_models:
      search: choice
      options:
      - 20
      - 30
      - 50
    max_features:
      search: choice
      options:
      - sqrt
      - log2
    lambda_value:
      search: choice
      options:
      - 6
      - 8
    disable_weighted_vote: false
    grace_period:
      search: int
      low: 100
      high: 180
    max_depth:
      search: choice
      options:
      - 10
      - 20
    split_criterion: info_gain
    delta:
      search: float
      low: -4
      high: -2
      exp: true
      base: 10
    tau:
      search: float
      low: 0.1
      high: 0.2
    leaf_prediction: mc
    nb_threshold:
      search: int
      low: 15
      high: 25
    drift_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -3
        exp: true
        base: 10
    warning_detector:
      type: adwin
      delta:
        search: float
        low: -4
        high: -2
        exp: true
        base: 10
search:
  metric: macro_f1
  max_trials: 25
  maximize: true
  seed: 54321
output:
  folder: experiments/outputs/streaming/BPIC_20_TPD
