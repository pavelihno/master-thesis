    lambda_value: 6
    leaf_prediction: nba
    max_depth: 40
    max_features: 0.5
    n_models: 50
    nb_threshold: 14
    seed: 42
    split_criterion: info_gain
    tau: 0.11473036872426576
    warning_detector:
      delta: 0.00015795068565804197
      type: adwin
  type: arf
output:
  folder: experiments/outputs/streaming/next_activity/baseline
