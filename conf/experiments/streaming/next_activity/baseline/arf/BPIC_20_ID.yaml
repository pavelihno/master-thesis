task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  end_events:
  - Payment Handled
transformer:
  include_prefix_len: false
  max_events: 6
  type: index
model:
  params:
    delta: 0.0010430140527645595
    disable_weighted_vote: false
    drift_detector:
      delta: 7.117492858704477e-05
      type: adwin
    grace_period: 130
    lambda_value: 6
    leaf_prediction: mc
    max_depth: 20
    max_features: sqrt
    n_models: 50
    nb_threshold: 11
    seed: 42
    split_criterion: gini
    tau: 0.13344847412446031
    warning_detector:
      delta: 0.0033955558552392364
      type: adwin
  type: arf
output:
  folder: experiments/outputs/streaming/next_activity/baseline
