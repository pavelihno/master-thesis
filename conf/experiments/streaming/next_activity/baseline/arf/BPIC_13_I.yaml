task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 6
  type: index
model:
  params:
    delta: 0.00012049038668680375
    disable_weighted_vote: false
    drift_detector:
      delta: 0.0008618283960225628
      type: adwin
    grace_period: 92
    lambda_value: 8
    leaf_prediction: mc
    max_depth: 30
    max_features: sqrt
    n_models: 50
    nb_threshold: 6
    split_criterion: gini
    tau: 0.14814888474229862
    warning_detector:
      delta: 0.0007056133878089007
      type: adwin
  type: arf
output:
  folder: experiments/outputs/streaming/next_activity/baseline
