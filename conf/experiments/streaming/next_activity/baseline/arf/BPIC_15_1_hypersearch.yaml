hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  terminator:
    type: oracle
transformer:
  type: index
  max_events:
    search: choice
    options:
    - 6
    - 8
    - 10
  include_prefix_len: false
model:
  type: arf
  params:
    n_models:
      search: choice
      options:
      - 20
      - 30
      - 50
    max_features:
      search: choice
      options:
      - sqrt
      - log2
    lambda_value:
      search: choice
      options:
      - 6
      - 8
    disable_weighted_vote: false
    grace_period:
      search: int
      low: 50
      high: 200
    max_depth:
      search: choice
      options:
      - 20
      - 30
    split_criterion:
      search: choice
      options:
      - info_gain
      - gini
    delta:
      search: float
      low: -5
      high: -2
      exp: true
      base: 10
    tau:
      search: float
      low: 0.01
      high: 0.15
    leaf_prediction:
      search: choice
      options:
      - mc
      - nb
    nb_threshold:
      search: int
      low: 5
      high: 25
    drift_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -3
        exp: true
        base: 10
    warning_detector:
      type: adwin
      delta:
        search: float
        low: -4
        high: -2
        exp: true
        base: 10
    seed: 42
search:
  metric: macro_f1
  max_trials: 50
  maximize: true
  seed: 123
output:
  folder: experiments/outputs/streaming/BPIC_15_1
