hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 666
dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  type: arf
  params:
    n_models:
      search: choice
      options:
      - 20
      - 30
      - 50
    max_features:
      search: choice
      options:
      - sqrt
      - log2
    lambda_value:
      search: choice
      options:
      - 6
      - 8
      - 10
    disable_weighted_vote: false
    grace_period:
      search: int
      low: 150
      high: 250
    max_depth:
      search: choice
      options:
      - 10
      - 20
    split_criterion: gini
    delta:
      search: float
      low: -5
      high: -3
      exp: true
      base: 10
    tau:
      search: float
      low: 0.05
      high: 0.15
    leaf_prediction: nba
    nb_threshold:
      search: int
      low: 10
      high: 20
    drift_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -3
        exp: true
        base: 10
    warning_detector:
      type: adwin
      delta:
        search: float
        low: -4
        high: -2
        exp: true
        base: 10
search:
  metric: macro_f1
  max_trials: 15
  maximize: true
  seed: 54321
output:
  folder: experiments/outputs/streaming/BPIC_13_C
