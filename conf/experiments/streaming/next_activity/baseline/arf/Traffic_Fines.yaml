task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 6
  type: index
model:
  params:
    delta: 0.0007856154227617023
    disable_weighted_vote: false
    drift_detector:
      delta: 2.248613674130468e-05
      type: adwin
    grace_period: 81
    lambda_value: 6
    leaf_prediction: nb
    max_depth: 15
    max_features: log2
    n_models: 50
    nb_threshold: 22
    split_criterion: info_gain
    tau: 0.032899932103938656
    warning_detector:
      delta: 0.0003520873701438826
      type: adwin
  type: arf
output:
  folder: experiments/outputs/streaming/next_activity/baseline
