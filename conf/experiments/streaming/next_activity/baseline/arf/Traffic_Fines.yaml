    n_models: 50
    nb_threshold: 24
    seed: 42
    split_criterion: info_gain
    tau: 0.016464223507230154
    warning_detector:
      delta: 0.002948067131961551
      type: adwin
  type: arf
output:
  folder: experiments/outputs/streaming/next_activity/baseline