hyperparam_search: true

task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events: ["Payment Handled"]

transformer:
  type:
    search: choice
    options: [index, dim]
  max_events:
    search: choice
    options: [4, 6, 8, 10]
  include_prefix_len: false

model:
  type: arf
  params:
    n_models:
      search: choice
      options: [10, 20, 30, 50, 75]

    max_features:
      search: choice
      options: [sqrt, log2, 0.5, 0.7]

    lambda_value:
      search: choice
      options: [4, 6, 8, 10]

    disable_weighted_vote:
      search: choice
      options: [false, true]

    grace_period:
      search: int
      low: 50
      high: 250

    max_depth:
      search: choice
      options: [10, 20, 30, 40]

    split_criterion:
      search: choice
      options: [info_gain, gini]

    delta:
      search: float
      low: -6
      high: -2
      exp: true
      base: 10

    tau:
      search: float
      low: 0.01
      high: 0.2

    leaf_prediction:
      search: choice
      options: [mc, nb, nba]

    nb_threshold:
      search: int
      low: 0
      high: 30

    drift_detector:
      type: adwin
      delta:
        search: float
        low: -6
        high: -3
        exp: true
        base: 10

    warning_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -2
        exp: true
        base: 10

    seed: 42

search:
  metric: macro_f1
  max_trials: 220
  maximize: true
  seed: 123

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
