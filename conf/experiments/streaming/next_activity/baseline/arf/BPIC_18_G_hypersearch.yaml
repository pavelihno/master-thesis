hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 28461
dataset:
  dataset_name: BPIC_18_G
  source: log
  dataset_path: datasets/raw/BPIC_18_G.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 10
  type: index
model:
  type: arf
  params:
    n_models:
      search: choice
      options:
      - 20
      - 30
      - 50
    max_features:
      search: choice
      options:
      - sqrt
      - log2
      - 0.5
    lambda_value:
      search: choice
      options:
      - 6
      - 8
      - 10
    disable_weighted_vote: false
    grace_period:
      search: int
      low: 50
      high: 150
    max_depth:
      search: choice
      options:
      - 30
      - 40
    split_criterion: info_gain
    delta:
      search: float
      low: -4
      high: -1
      exp: true
      base: 10
    tau:
      search: float
      low: 0.08
      high: 0.18
    leaf_prediction: nba
    nb_threshold:
      search: int
      low: 10
      high: 25
    drift_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -3
        exp: true
        base: 10
    warning_detector:
      type: adwin
      delta:
        search: float
        low: -4
        high: -2
        exp: true
        base: 10
search:
  metric: macro_f1
  max_trials: 15
  maximize: true
  seed: 54321
output:
  folder: experiments/outputs/streaming/BPIC_18_G
