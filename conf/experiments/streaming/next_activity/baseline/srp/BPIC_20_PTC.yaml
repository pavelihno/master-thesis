task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 4
  type: freq
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 7.657056654574284e-05
      type: adwin
    lam: 8
    n_models: 50
    subspace_size: 0.6
    training_method: patches
    warning_detector:
      delta: 0.00011207099885389467
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
