task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 3
  type: freq
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 9.237001076226606e-05
      type: adwin
    lam: 6
    n_models: 75
    subspace_size: 0.8
    training_method: patches
    warning_detector:
      delta: 0.00018260820671924956
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
