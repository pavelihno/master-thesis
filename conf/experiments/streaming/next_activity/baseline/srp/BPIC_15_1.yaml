task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 8
  type: index
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 5.607809821170859e-05
      type: adwin
    lam: 6
    n_models: 75
    subspace_size: 0.6
    training_method: patches
    warning_detector:
      delta: 0.00042810278116242536
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
