task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  end_events:
  - Payment Handled

transformer:
  include_prefix_len: false
  max_events: 8
  type: index

model:
  type: srp
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 6.728799671902097e-05
      type: adwin
    lam: 8
    n_models: 75
    seed: 42
    subspace_size: 0.6
    training_method: patches
    warning_detector:
      delta: 0.0002903218832244234
      type: adwin

output:
  folder: experiments/outputs/streaming/next_activity/baseline
