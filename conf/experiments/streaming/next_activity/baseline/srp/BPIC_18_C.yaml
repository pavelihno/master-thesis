task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 5.607809821170859e-05
      type: adwin
    lam: 6
    n_models: 50
    subspace_size: 0.8
    training_method: patches
    warning_detector:
      delta: 0.00042810278116242536
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
