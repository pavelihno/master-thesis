hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 5222
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 8
  type: index
model:
  type: srp
  params:
    n_models:
      search: choice
      options:
      - 50
      - 75
    subspace_size:
      search: choice
      options:
      - 0.6
      - 0.8
    training_method: patches
    lam:
      search: choice
      options:
      - 6
      - 8
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -4
        exp: true
        base: 10
    warning_detector:
      type: adwin
      delta:
        search: float
        low: -4
        high: -3
        exp: true
        base: 10
search:
  metric: macro_f1
  max_trials: 15
  maximize: true
  seed: 54321
output:
  folder: experiments/outputs/streaming/BPIC_15_1
