task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  end_events:
  - Payment Handled

transformer:
  include_prefix_len: false
  max_events: 4
  type: index

model:
  type: srp
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 2.3713961415751472e-05
      type: adwin
    lam: 8
    n_models: 50
    seed: 42
    subspace_size: 0.8
    training_method: patches
    warning_detector:
      delta: 0.0003195727435946093
      type: adwin

output:
  folder: experiments/outputs/streaming/baseline
