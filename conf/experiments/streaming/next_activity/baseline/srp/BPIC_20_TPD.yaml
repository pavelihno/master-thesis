task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  end_events:
  - Payment Handled

transformer:
  include_prefix_len: false
  max_events: 5
  type: index

model:
  type: srp
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      type: adwin
    lam: 1
    n_models: 10
    seed: 42
    subspace_size: 0.4
    training_method: patches
    warning_detector:
      type: adwin

output:
  folder: experiments/outputs/streaming/baseline
