hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  type: index
  max_events:
    search: choice
    options:
    - 6
    - 8
  include_prefix_len: false
model:
  type: srp
  params:
    n_models:
      search: choice
      options:
      - 15
      - 40
    subspace_size:
      search: choice
      options:
      - 0.6
      - 0.8
    training_method: patches
    lam: 8
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -4
        exp: true
        base: 10
    warning_detector:
      type: adwin
      delta:
        search: float
        low: -4
        high: -3
        exp: true
        base: 10
    seed: 42
search:
  metric: macro_f1
  max_trials: 7
  maximize: true
  seed: 123
output:
  folder: experiments/outputs/streaming/BPIC_20_TPD
