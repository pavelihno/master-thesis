task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 3
  type: freq
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 1.2124843560020962e-05
      type: adwin
    lam: 8
    n_models: 50
    subspace_size: 0.8
    training_method: patches
    warning_detector:
      delta: 0.0005056462560585958
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
