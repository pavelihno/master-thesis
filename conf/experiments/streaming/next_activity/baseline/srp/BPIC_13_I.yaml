task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 6
  type: index
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 1.0361291108142222e-05
      type: adwin
    lam: 6
    n_models: 50
    subspace_size: 0.6
    training_method: patches
    warning_detector:
      delta: 0.0001401727454175686
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
