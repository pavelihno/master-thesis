task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 6
  type: index
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 1.4995822762141962e-05
      type: adwin
    lam: 8
    n_models: 75
    subspace_size: 0.8
    training_method: subspaces
    warning_detector:
      delta: 0.0009813038197843574
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
