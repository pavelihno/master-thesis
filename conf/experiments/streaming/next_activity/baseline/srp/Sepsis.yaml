task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 4
  type: index
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 2.4460394471127048e-05
      type: adwin
    lam: 8
    n_models: 50
    subspace_size: 0.6
    training_method: subspaces
    warning_detector:
      delta: 0.00018979675203882653
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
