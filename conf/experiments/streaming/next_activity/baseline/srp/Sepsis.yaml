task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  include_prefix_len: false
  max_events: 8
  type: index
model:
  params:
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      delta: 1.7126952340497052e-05
      type: adwin
    lam: 8
    n_models: 50
    seed: 42
    subspace_size: 0.6
    training_method: patches
    warning_detector:
      delta: 0.0009430444960050567
      type: adwin
  type: srp
output:
  folder: experiments/outputs/streaming/next_activity/baseline
