hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  terminator:
    type: oracle
transformer:
  type: index
  max_events:
    search: choice
    options:
    - 8
    - 10
  include_prefix_len: false
model:
  type: srp
  params:
    n_models:
      search: choice
      options:
      - 50
      - 75
    subspace_size:
      search: choice
      options:
      - 0.6
      - 0.8
    training_method:
      search: choice
      options:
      - patches
      - subspaces
    lam:
      search: choice
      options:
      - 6
      - 8
    disable_detector: 'off'
    disable_weighted_vote: false
    drift_detector:
      type: adwin
      delta:
        search: float
        low: -5
        high: -4
        exp: true
        base: 10
    warning_detector:
      type: adwin
      delta:
        search: float
        low: -4
        high: -3
        exp: true
        base: 10
    seed: 42
search:
  metric: macro_f1
  max_trials: 50
  maximize: true
  seed: 123
output:
  folder: experiments/outputs/streaming/BPIC_13_C
