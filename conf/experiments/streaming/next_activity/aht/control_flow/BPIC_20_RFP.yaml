task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 1.2370965299272247e-06
    drift_detector:
      type: adwin
    grace_period: 50
    leaf_prediction: nba
    max_depth: 10
    nb_threshold: 11
    seed: 42
    split_criterion: gini
    switch_significance: 0.12171245039002321
    tau: 0.19340256380616747
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
