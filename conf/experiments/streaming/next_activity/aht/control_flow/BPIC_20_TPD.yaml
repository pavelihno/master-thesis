task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 0.008267561555889357
    drift_detector:
      type: adwin
    grace_period: 95
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 6
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.06713770772632444
    tau: 0.18452665880804694
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
