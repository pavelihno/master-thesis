task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 4.986893007979533e-05
    drift_detector:
      type: adwin
    grace_period: 57
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 23
    seed: 42
    split_criterion: gini
    switch_significance: 0.13214824253915206
    tau: 0.191531527777908
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
