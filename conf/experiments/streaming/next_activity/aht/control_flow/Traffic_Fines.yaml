task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 3.7501553350227373e-06
    drift_detector:
      type: adwin
    grace_period: 224
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 7
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.023896506085099814
    tau: 0.1470745950530007
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
