task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 3.538429045457946e-06
    drift_detector:
      type: adwin
    grace_period: 121
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 17
    split_criterion: info_gain
    switch_significance: 0.14898542423334088
    tau: 0.09392508445750641
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
