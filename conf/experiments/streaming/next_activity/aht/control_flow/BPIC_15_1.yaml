task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 1.787084980587981e-05
    drift_detector:
      type: adwin
    grace_period: 159
    leaf_prediction: nba
    max_depth: 10
    nb_threshold: 14
    seed: 42
    split_criterion: gini
    switch_significance: 0.07113622060792732
    tau: 0.11614389067773666
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
