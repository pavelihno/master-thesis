task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 0.008655690707632979
    drift_detector:
      type: adwin
    grace_period: 55
    leaf_prediction: nba
    max_depth: 10
    nb_threshold: 0
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.023237207913142828
    tau: 0.11587294598487226
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
