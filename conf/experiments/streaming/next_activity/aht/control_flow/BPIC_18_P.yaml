task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_P
  source: log
  dataset_path: datasets/raw/BPIC_18_P.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 0.003939599659619182
    drift_detector:
      type: adwin
    grace_period: 50
    leaf_prediction: nba
    max_depth: 10
    nb_threshold: 10
    seed: 42
    split_criterion: gini
    switch_significance: 0.10664777279555955
    tau: 0.1991211923790523
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
