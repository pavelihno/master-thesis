task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 0
  type: freq
model:
  params:
    delta: 0.0022879041352187562
    drift_detector:
      type: adwin
    grace_period: 73
    leaf_prediction: mc
    max_depth: 30
    nb_threshold: 20
    seed: 42
    split_criterion: gini
    switch_significance: 0.04182172507764927
    tau: 0.1889138188729009
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow
