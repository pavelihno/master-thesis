task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 3
  type: freq
model:
  params:
    delta: 0.0018654594107406078
    drift_detector:
      type: adwin
    grace_period: 80
    leaf_prediction: mc
    max_depth: 20
    nb_threshold: 23
    split_criterion: gini
    switch_significance: 0.08908979976130185
    tau: 0.19910442181114088
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
