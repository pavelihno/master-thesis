task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 4
  type: freq
model:
  params:
    delta: 3.992707456385409e-05
    drift_detector:
      type: adwin
    grace_period: 91
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 24
    seed: 42
    split_criterion: gini
    switch_significance: 0.09536919154347129
    tau: 0.15734649874477663
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
