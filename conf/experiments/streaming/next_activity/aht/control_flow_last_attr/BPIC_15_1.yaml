task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 3
  type: freq
model:
  params:
    delta: 0.00963294032038653
    drift_detector:
      type: adwin
    grace_period: 85
    leaf_prediction: mc
    max_depth: 20
    nb_threshold: 24
    split_criterion: gini
    switch_significance: 0.116815582509573
    tau: 0.19610200056613153
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
