task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 4
  type: freq
model:
  params:
    delta: 0.002063709890478762
    drift_detector:
      type: adwin
    grace_period: 247
    leaf_prediction: mc
    max_depth: 20
    nb_threshold: 30
    split_criterion: gini
    switch_significance: 0.11604173879781583
    tau: 0.13283264529349603
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
