task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 2
  type: freq
model:
  params:
    delta: 0.0029787008559011767
    drift_detector:
      type: adwin
    grace_period: 114
    leaf_prediction: nb
    max_depth: 40
    nb_threshold: 16
    seed: 42
    split_criterion: gini
    switch_significance: 0.018800910793367466
    tau: 0.1260725662330024
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
