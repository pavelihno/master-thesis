task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 3
  type: freq
model:
  params:
    delta: 0.0005330139887204439
    drift_detector:
      type: adwin
    grace_period: 173
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 13
    split_criterion: info_gain
    switch_significance: 0.1469127770205017
    tau: 0.09834571782789449
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
