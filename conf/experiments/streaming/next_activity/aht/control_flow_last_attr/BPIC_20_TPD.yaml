task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 6
  type: freq
model:
  params:
    delta: 0.00989451198458835
    drift_detector:
      type: adwin
    grace_period: 164
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 8
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.012001385688055713
    tau: 0.19036580261607505
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
