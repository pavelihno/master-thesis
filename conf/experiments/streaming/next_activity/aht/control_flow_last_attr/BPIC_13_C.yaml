task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 3
  type: freq
model:
  params:
    delta: 4.8027536773291625e-06
    drift_detector:
      type: adwin
    grace_period: 238
    leaf_prediction: nb
    max_depth: 20
    nb_threshold: 30
    split_criterion: gini
    switch_significance: 0.125800379542155
    tau: 0.077944072209408
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
