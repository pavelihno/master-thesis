task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 3
  type: freq
model:
  params:
    delta: 0.0018654594107406078
    drift_detector:
      type: adwin
    grace_period: 107
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 7
    split_criterion: gini
    switch_significance: 0.08340852495054088
    tau: 0.13241284835845274
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last_attr
