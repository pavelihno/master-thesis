task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_P
  source: log
  dataset_path: datasets/raw/BPIC_18_P.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 5
  type: freq
model:
  params:
    delta: 0.000467180845568029
    drift_detector:
      type: adwin
    grace_period: 71
    leaf_prediction: nb
    max_depth: 40
    nb_threshold: 4
    seed: 42
    split_criterion: gini
    switch_significance: 0.09300641016067146
    tau: 0.1951109134676696
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last
