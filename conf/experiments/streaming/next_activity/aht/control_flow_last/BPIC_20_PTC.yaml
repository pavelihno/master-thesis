task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 5
  type: freq
model:
  params:
    delta: 0.00972073684555309
    drift_detector:
      type: adwin
    grace_period: 100
    leaf_prediction: nb
    max_depth: 10
    nb_threshold: 20
    seed: 42
    split_criterion: gini
    switch_significance: 0.10753317573731248
    tau: 0.1873835723520125
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last
