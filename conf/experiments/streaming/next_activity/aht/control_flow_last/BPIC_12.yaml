task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 3
  type: freq
model:
  params:
    delta: 0.001901503130072808
    drift_detector:
      type: adwin
    grace_period: 93
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 30
    split_criterion: gini
    switch_significance: 0.09718959418626613
    tau: 0.1946698044682422
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last
