task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  params:
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 2
  type: freq
model:
  params:
    delta: 2.168005845812021e-06
    drift_detector:
      type: adwin
    grace_period: 101
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 8
    split_criterion: gini
    switch_significance: 0.026949872387961316
    tau: 0.011418136947107083
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last
