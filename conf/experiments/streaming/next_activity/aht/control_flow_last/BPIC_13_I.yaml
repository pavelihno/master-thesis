model:
  params:
    delta: 0.0001228853522977454
    drift_detector:
      type: adwin
    grace_period: 67
    leaf_prediction: nb
    max_depth: 30
    nb_threshold: 13
    split_criterion: info_gain
    switch_significance: 0.03252493839023628
    tau: 0.011212994112077797
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/control_flow_last
