task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 6
  type: index
model:
  params:
    delta: 0.0006987707650977985
    drift_detector:
      type: adwin
    grace_period: 133
    leaf_prediction: mc
    max_depth: 20
    nb_threshold: 20
    split_criterion: gini
    switch_significance: 0.1411435459483778
    tau: 0.05143904746534923
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_event_attr
