task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: false
    max_events: 6
  type: index
model:
  params:
    delta: 0.00620492827652828
    drift_detector:
      type: adwin
    grace_period: 105
    leaf_prediction: mc
    max_depth: 10
    nb_threshold: 18
    split_criterion: info_gain
    switch_significance: 0.1355829638876293
    tau: 0.026655438978400364
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_event_attr
