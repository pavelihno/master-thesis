task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 6
  type: index
model:
  params:
    delta: 0.0001681906370982401
    drift_detector:
      type: adwin
    grace_period: 132
    leaf_prediction: nba
    max_depth: 20
    nb_threshold: 10
    seed: 42
    split_criterion: gini
    switch_significance: 0.10049501556048629
    tau: 0.18243101646497628
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_event_attr
