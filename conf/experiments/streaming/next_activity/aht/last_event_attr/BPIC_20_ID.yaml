task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 10
  type: index
model:
  params:
    delta: 0.0005989550533795071
    drift_detector:
      type: adwin
    grace_period: 141
    leaf_prediction: mc
    max_depth: 30
    nb_threshold: 18
    seed: 42
    split_criterion: gini
    switch_significance: 0.07907273290833483
    tau: 0.1642741747165817
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_event_attr
