task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 4
  type: index
model:
  params:
    delta: 0.0030899761158698132
    drift_detector:
      type: adwin
    grace_period: 84
    leaf_prediction: mc
    max_depth: 10
    nb_threshold: 10
    seed: 42
    split_criterion: gini
    switch_significance: 0.09208312080788095
    tau: 0.150406024732952
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_event_attr
