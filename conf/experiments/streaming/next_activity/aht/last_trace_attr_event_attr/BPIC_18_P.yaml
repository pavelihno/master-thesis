task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_P
  source: log
  dataset_path: datasets/raw/BPIC_18_P.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: true
    max_events: 10
  type: index
model:
  params:
    delta: 0.0006585619269386844
    drift_detector:
      type: adwin
    grace_period: 56
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 12
    split_criterion: info_gain
    switch_significance: 0.04454294621279613
    tau: 0.18762612170573625
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr_event_attr
