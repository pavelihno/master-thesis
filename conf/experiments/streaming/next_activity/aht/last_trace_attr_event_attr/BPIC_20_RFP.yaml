task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 10
  type: index
model:
  params:
    delta: 0.0001580463003885344
    drift_detector:
      type: adwin
    grace_period: 238
    leaf_prediction: nb
    max_depth: 20
    nb_threshold: 12
    seed: 42
    split_criterion: gini
    switch_significance: 0.026725203777193805
    tau: 0.15336928877771294
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr_event_attr
