task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 10
  type: index
model:
  params:
    delta: 0.008419820886736902
    drift_detector:
      type: adwin
    grace_period: 130
    leaf_prediction: nba
    max_depth: 10
    nb_threshold: 18
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.060351330135379286
    tau: 0.04299260393026888
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr_event_attr
