task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: true
    max_events: 4
  type: index
model:
  params:
    delta: 0.00963294032038653
    drift_detector:
      type: adwin
    grace_period: 88
    leaf_prediction: mc
    max_depth: 20
    nb_threshold: 30
    split_criterion: gini
    switch_significance: 0.09874608189590868
    tau: 0.19453839134795328
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr_event_attr
