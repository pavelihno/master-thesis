task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: true
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 4
  type: index
model:
  params:
    delta: 2.854632654517835e-06
    drift_detector:
      type: adwin
    grace_period: 52
    leaf_prediction: nb
    max_depth: 20
    nb_threshold: 2
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.09381367886722555
    tau: 0.1411779351831916
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr_event_attr
