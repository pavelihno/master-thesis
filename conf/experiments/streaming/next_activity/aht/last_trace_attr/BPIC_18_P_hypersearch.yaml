hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 6649
dataset:
  dataset_name: BPIC_18_P
  source: log
  dataset_path: datasets/raw/BPIC_18_P.xes
  terminator:
    type: oracle
transformer:
  type: index
  params:
    include_prefix_len: false
    include_trace_attrs: true
    include_event_attrs: false
    last_events:
      search: choice
      options:
      - 2
      - 4
      - 6
      - 8
      - 10
model:
  type: aht
  params:
    drift_detector:
      type: adwin
    grace_period:
      search: int
      low: 50
      high: 250
    delta:
      search: float
      low: -6
      high: -2
      exp: true
      base: 10
    tau:
      search: float
      low: 0.01
      high: 0.2
    split_criterion:
      search: choice
      options:
      - info_gain
      - gini
    leaf_prediction:
      search: choice
      options:
      - mc
      - nb
      - nba
    nb_threshold:
      search: int
      low: 0
      high: 30
    switch_significance:
      search: float
      low: 0.01
      high: 0.15
    max_depth:
      search: choice
      options:
      - 10
      - 20
      - 30
      - 40
    seed: 42
search:
  metric: macro_f1
  max_trials: 100
  maximize: true
  seed: 123
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr
