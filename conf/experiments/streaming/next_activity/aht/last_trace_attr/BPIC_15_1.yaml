task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 8
  type: index
model:
  params:
    delta: 0.004872206607389403
    drift_detector:
      type: adwin
    grace_period: 124
    leaf_prediction: mc
    max_depth: 10
    nb_threshold: 5
    seed: 42
    split_criterion: gini
    switch_significance: 0.11622325830880945
    tau: 0.09938594309684685
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr
