task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 4
  type: index
model:
  params:
    delta: 0.0009758056892731581
    drift_detector:
      type: adwin
    grace_period: 201
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 24
    seed: 42
    split_criterion: gini
    switch_significance: 0.06168469958273777
    tau: 0.15057401545690774
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr
