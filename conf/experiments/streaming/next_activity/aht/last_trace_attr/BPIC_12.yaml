task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 4
  type: index
model:
  params:
    delta: 0.001526875194773508
    drift_detector:
      type: adwin
    grace_period: 219
    leaf_prediction: mc
    max_depth: 20
    nb_threshold: 17
    seed: 42
    split_criterion: gini
    switch_significance: 0.14641279632203
    tau: 0.0938233261976459
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr
