task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: true
    last_events: 6
  type: index
model:
  params:
    delta: 0.006106820887795336
    drift_detector:
      type: adwin
    grace_period: 104
    leaf_prediction: nba
    max_depth: 10
    nb_threshold: 9
    seed: 42
    split_criterion: gini
    switch_significance: 0.10012206675120214
    tau: 0.10037241784856966
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last_trace_attr
