task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 8
  type: index
model:
  params:
    delta: 5.051289319664113e-06
    drift_detector:
      type: adwin
    grace_period: 208
    leaf_prediction: nb
    max_depth: 30
    nb_threshold: 6
    seed: 42
    split_criterion: info_gain
    switch_significance: 0.0850155355754221
    tau: 0.024832703685332972
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last
