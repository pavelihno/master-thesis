task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 10
  type: index
model:
  params:
    delta: 0.0027285162029622562
    drift_detector:
      type: adwin
    grace_period: 240
    leaf_prediction: nb
    max_depth: 20
    nb_threshold: 8
    seed: 42
    split_criterion: gini
    switch_significance: 0.05108941889443575
    tau: 0.19875605094128296
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last
