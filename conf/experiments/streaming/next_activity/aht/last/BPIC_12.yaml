task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 6
  type: index
model:
  params:
    delta: 0.005865624742976836
    drift_detector:
      type: adwin
    grace_period: 66
    leaf_prediction: mc
    max_depth: 40
    nb_threshold: 14
    seed: 42
    split_criterion: gini
    switch_significance: 0.12390848935748033
    tau: 0.06022222661529221
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last
