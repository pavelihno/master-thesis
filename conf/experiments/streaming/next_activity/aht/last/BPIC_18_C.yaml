task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 8
  type: index
model:
  params:
    delta: 4.837198801397132e-05
    drift_detector:
      type: adwin
    grace_period: 159
    leaf_prediction: mc
    max_depth: 10
    nb_threshold: 20
    seed: 42
    split_criterion: gini
    switch_significance: 0.021293356261045976
    tau: 0.15691923303680955
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last
