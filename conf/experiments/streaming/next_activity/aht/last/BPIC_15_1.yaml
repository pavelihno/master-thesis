task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  params:
    include_event_attrs: false
    include_prefix_len: false
    include_trace_attrs: false
    last_events: 8
  type: index
model:
  params:
    delta: 0.004505942843491303
    drift_detector:
      type: adwin
    grace_period: 119
    leaf_prediction: nba
    max_depth: 40
    nb_threshold: 1
    seed: 42
    split_criterion: gini
    switch_significance: 0.11408828907506652
    tau: 0.03469958005618204
  type: aht
output:
  folder: experiments/outputs/streaming/next_activity/aht/last
