task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 100
    init_size: 25040
    loss_fn:
      type: cross_entropy
    n_classes: 24
    optimizer:
      lr: 0.00046950982522916837
      type: nadam
    sequence_model:
      dropout: 0.0022183262556536854
      head_dim: 32
      num_heads: 4
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 128
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
