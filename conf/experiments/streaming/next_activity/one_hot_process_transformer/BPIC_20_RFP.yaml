task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 3680
    loss_fn:
      type: cross_entropy
    n_classes: 19
    optimizer:
      lr: 0.0010399551524229065
      type: nadam
    sequence_model:
      dropout: 0.11378962703863696
      head_dim: 16
      num_heads: 8
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: last
      type: process_transformer
    sequence_window: 128
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
