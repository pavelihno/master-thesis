task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 56147
    loss_fn:
      type: cross_entropy
    n_classes: 11
    optimizer:
      lr: 0.0020123938750786024
      type: nadam
    sequence_model:
      dropout: 0.17160830807134536
      head_dim: 32
      num_heads: 8
      num_layers: 1
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 128
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/baseline/process_transformer
