task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 8659
    loss_fn:
      type: cross_entropy
    n_classes: 51
    optimizer:
      lr: 0.001628459369182687
      type: nadam
    sequence_model:
      dropout: 0.459290149712045
      hidden_dim: 34
      num_layers: 2
      type: lstm
    sequence_window: 7
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/one_hot
