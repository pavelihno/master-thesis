task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 1522
    loss_fn:
      type: cross_entropy
    n_classes: 16
    optimizer:
      lr: 0.007152176592902789
      type: nadam
    sequence_model:
      dropout: 0.342937183973446
      hidden_dim: 112
      num_layers: 2
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/one_hot
