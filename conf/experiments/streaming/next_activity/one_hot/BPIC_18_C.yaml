task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 10764
    loss_fn:
      type: cross_entropy
    n_classes: 7
    optimizer:
      lr: 0.00025024902115571105
      type: nadam
    sequence_model:
      dropout: 0.47714899914100917
      hidden_dim: 15
      num_layers: 1
      type: lstm
    sequence_window: 3
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/one_hot
