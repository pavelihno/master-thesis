task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 25040
    loss_fn:
      type: cross_entropy
    n_classes: 24
    optimizer:
      lr: 0.019762642490946582
      type: nadam
    sequence_model:
      dropout: 0.20685914083071044
      hidden_dim: 59
      num_layers: 1
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/one_hot
