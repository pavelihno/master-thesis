task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_P
  source: log
  dataset_path: datasets/raw/BPIC_18_P.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 9304
    loss_fn:
      type: cross_entropy
    n_classes: 10
    optimizer:
      lr: 0.009392800131786578
      type: nadam
    sequence_model:
      dropout: 0.2893999937062631
      hidden_dim: 11
      num_layers: 1
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/one_hot
