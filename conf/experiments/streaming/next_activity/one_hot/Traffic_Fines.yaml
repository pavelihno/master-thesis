task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 56147
    loss_fn:
      type: cross_entropy
    n_classes: 11
    optimizer:
      lr: 0.02659083866212255
      type: nadam
    sequence_model:
      dropout: 0.19645687698290523
      hidden_dim: 52
      num_layers: 1
      type: lstm
    sequence_window: 7
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/one_hot
