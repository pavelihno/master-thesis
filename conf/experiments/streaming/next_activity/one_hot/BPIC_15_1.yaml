task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    encoding: one_hot
    epochs: 30
    init_size: 5222
    loss_fn:
      type: cross_entropy
    n_classes: 289
    optimizer:
      lr: 0.009751640389335996
      type: nadam
    sequence_model:
      dropout: 0.6070686105239718
      hidden_dim: 59
      num_layers: 2
      type: lstm
    sequence_window: 50
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/one_hot
