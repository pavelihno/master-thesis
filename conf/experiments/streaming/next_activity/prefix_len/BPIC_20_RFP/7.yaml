task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 256
    epochs: 30
    init_size: 3680
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.011548600803070894
      type: nadam
    sequence_model:
      dropout: 0.06286364852405335
      hidden_dim: 52
      num_layers: 2
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/prefix_len
