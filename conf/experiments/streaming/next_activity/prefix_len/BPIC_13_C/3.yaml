task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 30
    init_size: 666
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.0881536977063229
      type: nadam
    sequence_model:
      dropout: 0.6346428242772346
      hidden_dim: 19
      num_layers: 2
      type: lstm
    sequence_window: 3
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/BPIC_13_C
