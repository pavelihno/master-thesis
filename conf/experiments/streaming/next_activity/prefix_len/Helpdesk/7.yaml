task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 30
    init_size: 2135
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.007828079853216818
      type: nadam
    sequence_model:
      dropout: 0.4672133514179332
      hidden_dim: 109
      num_layers: 3
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/prefix_len
