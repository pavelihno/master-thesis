hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 2135
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    w2v_window: 5
    sequence_window: 7
    embedding_dim:
      search: choice
      options:
      - 64
      - 128
      - 256
    batch_size:
      search: choice
      options:
      - 32
      - 64
    epochs: 30
    dynamic_n_classes: true
    max_n_classes: 30
    init_size: 1337
    sequence_model:
      type: lstm
      hidden_dim:
        search: int
        low: 10
        high: 150
        log: true
      num_layers:
        search: choice
        options:
        - 1
        - 2
        - 3
      dropout:
        search: float
        low: 0.0
        high: 1.0
    optimizer:
      type: nadam
      lr:
        search: float
        low: -4
        high: -1
        exp: true
        base: 10
    loss_fn:
      type: cross_entropy
    drift_detector:
      type: adwin
search:
  metric: macro_f1
  maximize: true
  max_trials: 25
  seed: 123
output:
  folder: experiments/outputs/streaming/prefix_len/Helpdesk
