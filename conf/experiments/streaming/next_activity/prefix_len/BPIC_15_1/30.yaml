task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_15_1
  source: log
  dataset_path: datasets/raw/BPIC_15_1.xes
  activity_col: activityNameEN
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 256
    epochs: 30
    init_size: 5222
    loss_fn:
      type: cross_entropy
    max_n_classes: 290
    optimizer:
      lr: 0.006868291555155145
      type: nadam
    sequence_model:
      dropout: 0.03348813500906674
      hidden_dim: 55
      num_layers: 2
      type: lstm
    sequence_window: 30
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/prefix_len
