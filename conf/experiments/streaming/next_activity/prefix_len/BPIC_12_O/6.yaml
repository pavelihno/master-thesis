task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12_O
  source: log
  dataset_path: datasets/raw/BPIC_12_O.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 3125
    loss_fn:
      type: cross_entropy
    max_n_classes: 55
    optimizer:
      lr: 0.007781030601298265
      type: nadam
    sequence_model:
      dropout: 0.06443898205588747
      hidden_dim: 47
      num_layers: 2
      type: lstm
    sequence_window: 6
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/prefix_len
