task:
  type: next_activity
  mode: predict_and_learn
  max_events: 1522
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 30
    init_size: 1127
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.019762642490946582
      type: nadam
    sequence_model:
      dropout: 0.20685914083071044
      hidden_dim: 59
      num_layers: 2
      type: lstm
    sequence_window: 4
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/Sepsis
