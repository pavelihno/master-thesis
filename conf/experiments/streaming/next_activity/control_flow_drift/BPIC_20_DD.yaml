task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 5644
    loss_fn:
      type: cross_entropy
    n_classes: 17
    optimizer:
      lr: 0.011907770036395787
      type: nadam
    sequence_model:
      dropout: 0.1485955986042369
      hidden_dim: 99
      num_layers: 1
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
