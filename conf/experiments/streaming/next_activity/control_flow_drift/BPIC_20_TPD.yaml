task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    dynamic_n_classes: true
    embedding_dim: 512
    epochs: 30
    init_size: 8659
    loss_fn:
      type: cross_entropy
    max_n_classes: 55
    optimizer:
      lr: 0.001765746266670821
      type: nadam
    sequence_model:
      dropout: 0.2923799479287687
      hidden_dim: 29
      num_layers: 2
      type: lstm
    sequence_window: 7
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
