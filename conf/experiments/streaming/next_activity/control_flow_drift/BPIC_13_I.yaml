task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 6554
    loss_fn:
      type: cross_entropy
    n_classes: 4
    optimizer:
      lr: 0.0020123938750786024
      type: nadam
    sequence_model:
      dropout: 0.3432166161426907
      hidden_dim: 39
      num_layers: 2
      type: lstm
    sequence_window: 4
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
