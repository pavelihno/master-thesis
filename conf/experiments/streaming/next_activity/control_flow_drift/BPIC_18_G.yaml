task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_G
  source: log
  dataset_path: datasets/raw/BPIC_18_G.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 43601
    loss_fn:
      type: cross_entropy
    n_classes: 16
    optimizer:
      lr: 0.007226272585742527
      type: nadam
    sequence_model:
      dropout: 0.5104207909750477
      hidden_dim: 27
      num_layers: 3
      type: lstm
    sequence_window: 6
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
