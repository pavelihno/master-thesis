task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_G
  source: log
  dataset_path: datasets/raw/BPIC_18_G.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 43601
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.024740262153704607
      type: nadam
    sequence_model:
      dropout: 0.31880847709137183
      hidden_dim: 15
      num_layers: 3
      type: lstm
    sequence_window: 5
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift