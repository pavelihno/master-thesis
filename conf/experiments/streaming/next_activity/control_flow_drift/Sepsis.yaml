task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Sepsis
  source: log
  dataset_path: datasets/raw/Sepsis.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 1522
    loss_fn:
      type: cross_entropy
    n_classes: 16
    optimizer:
      lr: 0.040868341377948994
      type: nadam
    sequence_model:
      dropout: 0.4288982536625993
      hidden_dim: 136
      num_layers: 1
      type: lstm
    sequence_window: 7
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
