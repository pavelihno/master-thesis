task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_13_C
  source: log
  dataset_path: datasets/raw/BPIC_13_C.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 666
    loss_fn:
      type: cross_entropy
    n_classes: 4
    optimizer:
      lr: 0.017758349727627267
      type: nadam
    sequence_model:
      dropout: 0.32642360538879067
      hidden_dim: 16
      num_layers: 3
      type: lstm
    sequence_window: 6
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
