task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 2135
    loss_fn:
      type: cross_entropy
    n_classes: 14
    optimizer:
      lr: 0.012414228315795492
      type: nadam
    sequence_model:
      dropout: 0.2475979325052119
      hidden_dim: 104
      num_layers: 1
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
