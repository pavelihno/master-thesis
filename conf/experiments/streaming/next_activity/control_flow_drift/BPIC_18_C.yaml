task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_18_C
  source: log
  dataset_path: datasets/raw/BPIC_18_C.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 10764
    loss_fn:
      type: cross_entropy
    n_classes: 7
    optimizer:
      lr: 0.0005751154174754405
      type: nadam
    sequence_model:
      dropout: 0.36938041450750536
      hidden_dim: 25
      num_layers: 3
      type: lstm
    sequence_window: 4
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
