task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: Traffic_Fines
  source: log
  dataset_path: datasets/raw/Traffic_Fines.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 56147
    loss_fn:
      type: cross_entropy
    n_classes: 11
    optimizer:
      lr: 0.018299399204731597
      type: nadam
    sequence_model:
      dropout: 0.4672133514179332
      hidden_dim: 109
      num_layers: 2
      type: lstm
    sequence_window: 6
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
