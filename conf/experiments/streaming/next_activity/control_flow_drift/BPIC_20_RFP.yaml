task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 3680
    loss_fn:
      type: cross_entropy
    n_classes: 19
    optimizer:
      lr: 0.0643868765924486
      type: nadam
    sequence_model:
      dropout: 0.025895030336220277
      hidden_dim: 29
      num_layers: 3
      type: lstm
    sequence_window: 6
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
