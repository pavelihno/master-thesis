task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    dynamic_n_classes: true
    embedding_dim: 64
    epochs: 30
    init_size: 3680
    loss_fn:
      type: cross_entropy
    max_n_classes: 30
    optimizer:
      lr: 0.06869218145179959
      type: nadam
    sequence_model:
      dropout: 0.3047227164457357
      hidden_dim: 127
      num_layers: 1
      type: lstm
    sequence_window: 5
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift