hyperparam_search: true
task:
  type: next_activity
  mode: predict_and_learn
  max_events: 6554
dataset:
  dataset_name: BPIC_13_I
  source: log
  dataset_path: datasets/raw/BPIC_13_I.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  type: darwin_classifier
  params:
    w2v_window: 5
    sequence_window:
      search: choice
      options:
      - 3
      - 4
      - 5
      - 6
      - 7
    embedding_dim:
      search: choice
      options:
      - 128
      - 256
      - 512
    sequence_model:
      type: lstm
      hidden_dim:
        search: int
        low: 10
        high: 150
        log: true
      num_layers:
        search: choice
        options:
        - 2
        - 3
      dropout:
        search: float
        low: 0.0
        high: 1.0
    batch_size:
      search: choice
      options:
      - 32
      - 64
    epochs: 30
    init_size: 5243
    optimizer:
      type: nadam
      lr:
        search: float
        low: -3
        high: -1
        exp: true
        base: 10
    loss_fn:
      type: cross_entropy
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    n_classes: 4
search:
  metric: macro_f1
  maximize: true
  max_trials: 50
  seed: 123
output:
  folder: experiments/outputs/streaming/BPIC_13_I
