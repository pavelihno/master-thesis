task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 7216
    loss_fn:
      type: cross_entropy
    n_classes: 34
    optimizer:
      lr: 0.005455850550540472
      type: nadam
    sequence_model:
      dropout: 0.1261656781465571
      hidden_dim: 73
      num_layers: 2
      type: lstm
    sequence_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
