task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    dynamic_n_classes: true
    embedding_dim: 128
    epochs: 30
    init_size: 7216
    loss_fn:
      type: cross_entropy
    max_n_classes: 40
    optimizer:
      lr: 0.001466209571511212
      type: nadam
    sequence_model:
      dropout: 0.259211960993182
      hidden_dim: 124
      num_layers: 2
      type: lstm
    sequence_window: 6
    w2v_window: 5
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
