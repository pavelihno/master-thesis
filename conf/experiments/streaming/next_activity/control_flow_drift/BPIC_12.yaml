task:
  type: next_activity
  mode: predict_and_learn
dataset:
  dataset_name: BPIC_12
  source: log
  dataset_path: datasets/raw/BPIC_12.xes
  terminator:
    type: oracle
transformer:
  type: darwin
model:
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    drift_trigger: control_flow
    encoding: one_hot
    epochs: 30
    init_size: 25040
    loss_fn:
      type: cross_entropy
    n_classes: 24
    optimizer:
      lr: 0.03131243753731294
      type: nadam
    sequence_model:
      dropout: 0.2695636796827644
      hidden_dim: 140
      num_layers: 1
      type: lstm
    sequence_window: 6
  type: darwin_classifier
output:
  folder: experiments/outputs/streaming/next_activity/control_flow_drift
