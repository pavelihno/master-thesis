task:
  type: next_activity
  mode: predict_and_learn 

dataset:
  dataset_name: BPIC_20_DD
  dataset_path: datasets/raw/BPIC_20_DD.xes

transformer:
  type: darwin

model:
  type: darwin
  params:
    embedding_dim: 64
    w2v_window: 2
    sequence_window: 4
    hidden_dim: 128
    lstm_layers: 1
    n_classes: 200
    init_size: 5000

    optimizer:
      type: adam
      lr: 0.001

    loss_fn:
      type: cross_entropy

    drift_detector:
      type: none

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
