task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events: ["Payment Handled"]

transformer:
  type: darwin

model:
  type: darwin
  params:
    embedding_dim: 64
    w2v_window: 2
    sequence_window: 4
    hidden_dim: 128
    lstm_layers: 1
    dropout: 0.0
    batch_size: 32
    epochs: 1
    dynamic_n_classes: true
    max_n_classes: 20
    init_size: 1050

    optimizer:
      type: adam
      lr: 0.001

    loss_fn:
      type: cross_entropy

    drift_detector:
      type: adwin
      delta: 0.0001


output:
  folder: experiments/outputs/streaming/BPIC_20_DD
