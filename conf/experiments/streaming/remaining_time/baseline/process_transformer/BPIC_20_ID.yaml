task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 128
    drift_detector:
      type: adwin
    embedding_dim: 256
    epochs: 100
    feature_size: 3
    init_size: 4823
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 1.1233719002474276e-05
      type: adam
    sequence_model:
      dropout: 0.07034044648596026
      head_dim: 32
      num_heads: 4
      num_layers: 3
      pooling_dropout: 0.1
      pooling_type: mean
      type: process_transformer
    sequence_window: 3
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
