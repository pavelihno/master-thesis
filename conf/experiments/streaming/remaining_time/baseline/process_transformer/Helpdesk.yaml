task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 128
    drift_detector:
      type: adwin
    embedding_dim: 64
    epochs: 100
    feature_size: 3
    init_size: 1819
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 1.4854080648715547e-05
      type: adam
    sequence_model:
      dropout: 0.06656690465455545
      head_dim: 64
      num_heads: 8
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: mean
      type: process_transformer
    sequence_window: 6
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
