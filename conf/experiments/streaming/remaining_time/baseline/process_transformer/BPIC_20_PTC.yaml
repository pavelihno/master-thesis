task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 256
    epochs: 100
    feature_size: 3
    init_size: 1333
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.00017133895908918556
      type: adam
    sequence_model:
      dropout: 0.14247189432823543
      head_dim: 32
      num_heads: 8
      num_layers: 3
      pooling_dropout: 0.1
      pooling_type: mean
      type: process_transformer
    sequence_window: 6
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
