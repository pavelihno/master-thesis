hyperparam_search: true
task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
  max_events: 3013
dataset:
  dataset_name: BPIC_20_RFP
  source: log
  dataset_path: datasets/raw/BPIC_20_RFP.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size:
      search: choice
      options:
      - 32
      - 64
      - 128
    drift_detector:
      type: adwin
    embedding_dim:
      search: choice
      options:
      - 64
      - 128
      - 256
    epochs: 100
    feature_size: 3
    init_size: 1683
    loss_fn:
      type: log_cosh
    optimizer:
      type: adam
      lr:
        search: float
        low: -5
        high: -2
        exp: true
        base: 10
    sequence_model:
      type: process_transformer
      head_dim:
        search: choice
        options:
        - 16
        - 32
        - 64
      num_heads:
        search: choice
        options:
        - 4
        - 8
      num_layers:
        search: choice
        options:
        - 1
        - 2
        - 3
      dropout:
        search: float
        low: 0.0
        high: 0.5
      pooling_type:
        search: choice
        options:
        - max
        - mean
      pooling_dropout: 0.1
    sequence_window:
      search: choice
      options:
      - 3
      - 4
      - 5
      - 6
      - 7
    w2v_window: 5
search:
  metric: mae
  maximize: false
  max_trials: 150
  seed: 123
output:
  folder: experiments/outputs/streaming/remaining_time/BPIC_20_RFP
