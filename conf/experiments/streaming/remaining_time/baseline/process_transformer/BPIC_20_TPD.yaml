task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 128
    drift_detector:
      type: adwin
    embedding_dim: 128
    epochs: 100
    feature_size: 3
    init_size: 5247
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 1.265269295710872e-05
      type: adam
    sequence_model:
      dropout: 0.03600141107061996
      head_dim: 16
      num_heads: 8
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: max
      type: process_transformer
    sequence_window: 4
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
