task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 64
    epochs: 100
    feature_size: 3
    init_size: 3605
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.002202076457574741
      type: adam
    sequence_model:
      dropout: 0.18345503223029905
      head_dim: 16
      num_heads: 4
      num_layers: 2
      pooling_dropout: 0.1
      pooling_type: mean
      type: process_transformer
    sequence_window: 6
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
