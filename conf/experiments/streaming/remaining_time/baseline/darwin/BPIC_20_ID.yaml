task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days

dataset:
  dataset_name: BPIC_20_ID
  source: log
  dataset_path: datasets/raw/BPIC_20_ID.xes
  end_events:
  - Payment Handled
  censored: true

transformer:
  type: darwin_time

model:
  type: darwin_regressor
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 64
    epochs: 50
    feature_size: 3
    init_size: 4823
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.00019079356652214
      type: adam
    sequence_model:
      dropout: 0.21669505309035023
      hidden_dim: 36
      num_layers: 1
      type: lstm
    sequence_window: 3
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/remaining_time/baseline