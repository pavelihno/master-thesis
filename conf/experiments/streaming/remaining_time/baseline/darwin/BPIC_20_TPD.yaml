task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: BPIC_20_TPD
  source: log
  dataset_path: datasets/raw/BPIC_20_TPD.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 128
    epochs: 50
    feature_size: 3
    init_size: 5247
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.0006888612103203835
      type: adam
    sequence_model:
      dropout: 0.472301174414652
      hidden_dim: 14
      num_layers: 1
      type: lstm
    sequence_window: 3
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
