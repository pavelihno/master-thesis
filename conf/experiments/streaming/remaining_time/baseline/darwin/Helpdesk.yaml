task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 128
    epochs: 50
    feature_size: 3
    init_size: 1819
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.0010644908463591908
      type: adam
    sequence_model:
      dropout: 0.22830506912940604
      hidden_dim: 37
      num_layers: 2
      type: lstm
    sequence_window: 4
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
