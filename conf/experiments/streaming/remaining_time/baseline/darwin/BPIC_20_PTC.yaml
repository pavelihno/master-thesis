task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
dataset:
  dataset_name: BPIC_20_PTC
  source: log
  dataset_path: datasets/raw/BPIC_20_PTC.xes
  terminator:
    type: oracle
transformer:
  type: darwin_time
model:
  type: darwin_regressor
  params:
    batch_size: 32
    drift_detector:
      type: adwin
    embedding_dim: 64
    epochs: 50
    feature_size: 3
    init_size: 1333
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.004390642464810736
      type: adam
    sequence_model:
      dropout: 0.7508089099591864
      hidden_dim: 117
      num_layers: 1
      type: lstm
    sequence_window: 6
    w2v_window: 5
output:
  folder: experiments/outputs/streaming/remaining_time/baseline
