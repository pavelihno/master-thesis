task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days

dataset:
  dataset_name: BPIC_20_DD
  source: log
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events:
  - Payment Handled
  censored: true

transformer:
  type: darwin_time
  
model:
  type: darwin_regressor
  params:
    batch_size: 64
    drift_detector:
      type: adwin
    embedding_dim: 64
    epochs: 50
    feature_size: 3
    init_size: 3605
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.008565597453686966
      type: adam
    sequence_model:
      dropout: 0.48100939111006813
      hidden_dim: 28
      num_layers: 3
      type: lstm
    sequence_window: 4
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/remaining_time/baseline
