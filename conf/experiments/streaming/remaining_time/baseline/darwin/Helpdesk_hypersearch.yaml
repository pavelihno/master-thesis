hyperparam_search: true

task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days
  max_events: 2559

dataset:
  dataset_name: Helpdesk
  source: log
  dataset_path: datasets/raw/Helpdesk.xes
  end_events:
  - Closed
  censored: true

transformer:
  type: darwin_time

model:
  type: darwin_regressor
  params:
    batch_size: # 2^5 - 2^8
      search: choice
      options: [32, 64, 128]

    drift_detector:
      type: adwin

    embedding_dim: # 2^4 - 2^10
      search: choice
      options: [64, 128, 256]

    epochs: 50

    feature_size: 3

    init_size: 1358

    loss_fn:
      type: log_cosh

    optimizer:
      type: adam
      lr: # 10^-4 - 10^-2
        search: float
        low: -4
        high: -2
        exp: true
        base: 10

    sequence_model:
      type: lstm

      hidden_dim: # 10 - 150
        search: int
        low: 10
        high: 150
        log: true

      num_layers: # 1, 2, 3
        search: choice
        options: [1, 2, 3]

      dropout: # 0.0 - 1.0
        search: float
        low: 0.0
        high: 1.0

    sequence_window: # 3 - 7
      search: choice
      options: [3, 4, 5, 6, 7]

    w2v_window: 5

search:
  metric: mae
  maximize: false
  max_trials: 150
  seed: 123

output:
  folder: experiments/outputs/streaming/remaining_time/Helpdesk
