task:
  type: remaining_time
  mode: predict_and_learn
  time_target: days

dataset:
  dataset_name: Hospital_Billing
  source: log
  dataset_path: datasets/raw/Hospital_Billing.xes
  end_events:
  - BILLED
  - NEW
  censored: true

transformer:
  type: darwin_time

model:
  type: darwin_regressor
  params:
    batch_size: 128
    drift_detector:
      type: adwin
    embedding_dim: 256
    epochs: 50
    feature_size: 3
    init_size: 23352
    loss_fn:
      type: log_cosh
    optimizer:
      lr: 0.00011746315653523956
      type: adam
    sequence_model:
      dropout: 0.7738826603202918
      hidden_dim: 10
      num_layers: 3
      type: lstm
    sequence_window: 6
    w2v_window: 5

output:
  folder: experiments/outputs/streaming/remaining_time/baseline
