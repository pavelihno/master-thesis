experiment_name: srp_cf_bpic20dd

dataset:
  dataset_name: BPIC_20_DD
  dataset_path: datasets/raw/BPIC_20_DD.xes

transformer:
  type: cf
  max_events: null

model:
  type: srp
  params:
    n_models: 100
    subspace_size: 0.6
    lam: 6
    drift_detector: 1.0e-5
    warning_detector: 1.0e-4
    seed: 42

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
