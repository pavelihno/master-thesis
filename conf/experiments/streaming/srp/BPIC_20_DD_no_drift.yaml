task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events: ["Payment Handled"]

transformer:
  type: index
  max_events: null

model:
  type: srp
  params:
    n_models: 20
    subspace_size: 0.6
    training_method: patches
    lam: 6

    disable_detector: "off"
    disable_weighted_vote: false

    drift_detector:
      type: none

    warning_detector:
      type: none

    seed: 42

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
