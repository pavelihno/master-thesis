hyperparam_search: true

task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events: ["Payment Handled"]

transformer:
  type: [index, dim]
  max_events: [4, 6, 8]
  include_prefix_len: false

model:
  type: srp
  params:
    n_models: [20, 50, 100]
    subspace_size: [0.4, 0.6, 0.8]
    training_method: [subspaces, resampling, patches]
    lam: [4, 6, 8]

    disable_detector: "off"
    disable_weighted_vote: [false, true]

    drift_detector:
      type: adwin
      delta: [1.0e-5, 1.0e-4, 1.0e-3]

    warning_detector:
      type: adwin
      delta: [1.0e-4, 1.0e-3, 1.0e-2]

    seed: 42

search:
  method: grid
  metric: f1_macro
  maximize: true

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
