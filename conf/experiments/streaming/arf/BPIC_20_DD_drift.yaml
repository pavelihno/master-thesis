task:
  type: next_activity
  mode: predict_and_learn

dataset:
  dataset_name: BPIC_20_DD
  dataset_path: datasets/raw/BPIC_20_DD.xes
  end_events:
    - 'Payment Handled'

transformer:
  type: index
  max_events: null

model:
  type: arf
  params:
    n_models: 20
    max_features: sqrt
    lambda_value: 6

    disable_weighted_vote: false

    grace_period: 100
    max_depth: 20
    split_criterion: info_gain
    delta: 0.001
    tau: 0.05
    leaf_prediction: nba
    nb_threshold: 10

    drift_detector:
      type: adwin
      delta: 0.0001

    warning_detector:
      type: adwin
      delta: 0.001

    seed: 42

output:
  folder: experiments/outputs/streaming/BPIC_20_DD
