experiment_name: xgb_bpic12o_hypersearch

dataset:
  type: outcome
  dataset_name: BPIC_12_O
  dataset_folder: datasets/raw
  labels_folder: datasets/labels/binary
  train_ratio: 0.8
  min_prefix: 3
  max_prefix: 10

bucketer:
  type: prefix_length
  case_id_col: prefix_id

transformer:
  type: aggregate
  case_id_col: prefix_id
  cat_cols:
    - concept:name
  num_cols:
    - time_since_last_event
    - elapsed_time

model:
  type: xgboost
  
  param_grid:
    n_estimators: [100, 150]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.05, 0.1]
    subsample: [0.8, 0.9, 1.0]
    colsample_bytree: [0.8, 0.9, 1.0]
    gamma: [0, 0.1]
    random_state: 42

output:
  folder: experiments/outputs
  save_best_model: true
  model_folder: experiments/models
